<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Destination Details</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet"
href="destination-details.css">

</head>

<body>


    <header>

<nav>

<div class="logo">

TravelX

</div>

<ul>

<li>

<a href="index.html">

Home

</a>

</li>

</ul>

</nav>

</header>


<section class="hero">

<img id="heroImage">

<div class="overlay"></div>

<div class="hero-content">

<h1 id="destinationName">

Destination

</h1>

<p id="destinationTag">

Beautiful Place

</p>

</div>

</section>


<section class="info">

<div class="container">

<div class="left">

<h2>

About Destination

</h2>

<p id="description"></p>

</div>

<div class="right">

<div class="card">

<h3>Price</h3>

<p id="price"></p>

</div>

<div class="card">

<h3>Duration</h3>

<p id="duration"></p>

</div>

<div class="card">

<h3>Best Time</h3>

<p id="season"></p>

</div>

</div>

</div>

</section>

<section class="gallery">

<h2>

Gallery

</h2>

<div class="gallery-grid">

<img id="img1">

<img id="img2">

<img id="img3">

</div>

</section>


<script src="destination-details.js"></script>

</body>

</html>
